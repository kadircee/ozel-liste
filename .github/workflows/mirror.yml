name: mirror-senkron

# Pure Mirror otomasyonu: kaynak senkronu + tablo tazeleme + registry.
# - schedule: her gun 05:00 UTC (GitHub tarafinda birkac dakika sarkabilir)
# - workflow_dispatch: Actions sekmesinden tek tusla manuel tetikleme
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: mirror-senkron
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklar (ftfy - aciklama mojibake onarimi)
        run: python -m pip install --quiet ftfy
      - name: Kaynak senkronu + tablo tazeleme (Pure Mirror)
        run: python update.py
      - name: Registry senkron + tablo uretimi
        run: |
          python registry.py --sync
          python registry.py --render --write
      - name: Model + tazelik denetimi (sert kapi)
        run: python registry.py --check
      - name: Degisiklik varsa commit+push
        run: |
          git config user.name "kadircee"
          git config user.email "kadircee@users.noreply.github.com"
          git add plugins.json registry.json DEPO-BILGILERI.md
          if ! git diff --cached --quiet; then
            git commit -m "otomatik mirror senkronu"
            git pull --rebase
            git push
          else
            echo "degisiklik yok"
          fi
      - name: jsDelivr cache temizligi (push sonrasi)
        run: python update.py --purge
      # Karar denetimi bilgi amaclidir: flip/yeni aday raporu commit'i engellemez.
      # Boylece bir gunluk karar beklemesi diger eklentilerin senkronunu durdurmaz.
      - name: Kaynak karar denetimi (rapor)
        continue-on-error: true
        run: python audit.py --check
